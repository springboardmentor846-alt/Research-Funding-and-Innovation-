services:
  postgres:
    image: postgres:16
    container_name: research_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: research_platform
      POSTGRES_USER: research_user
      POSTGRES_PASSWORD: research_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_user -d research_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: research_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: sqlite:///./research_platform.db

    volumes:
      - ./backend/research_platform.db:/app/research_platform.db

    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: research_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

volumes:
  postgres_data: